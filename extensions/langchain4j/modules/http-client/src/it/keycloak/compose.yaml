services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./lc4j-mcp-e2e-realm.json:/opt/keycloak/data/import/lc4j-mcp-e2e-realm.json:ro,Z
