server:
  host: "127.0.0.1"
  port: 0
  max-payload-size: 262144
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/WEB"
          welcome: "index.html"

assistant:
  docs-path: "src/test/resources/docs"
  chunk-size: 1000
  chunk-overlap: 100

langchain4j:
  models:
    assistant-model:
      provider: helidon-mock
  embedding-stores:
    se-docs:
      provider: lc4j-in-memory
    mp-docs:
      provider: lc4j-in-memory
  content-retrievers:
    se-docs:
      provider: lc4j-content-retriever
      embedding-model: docs-embedding-model
      embedding-store: se-docs
      max-results: 2
      min-score: 0.0
    mp-docs:
      provider: lc4j-content-retriever
      embedding-model: docs-embedding-model
      embedding-store: mp-docs
      max-results: 2
      min-score: 0.0
