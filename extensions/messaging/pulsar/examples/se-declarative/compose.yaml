services:
  pulsar:
    image: apachepulsar/pulsar:4.0.13
    command: ["bin/pulsar", "standalone", "--advertised-address", "localhost"]
    ports:
      - "6650:6650"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
