openapi: 3.0.3
info:
  title: JSON String Enum Test
  version: 1.0.0
paths:
  /enum/{routeMode}:
    post:
      tags: [enums]
      operationId: inspectMode
      parameters:
        - name: routeMode
          in: path
          required: true
          schema:
            type: string
            enum: [fast-mode, authZ]
        - name: mode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Mode'
        - name: modes
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Mode'
        - name: X-Trace-Mode
          in: header
          required: true
          schema:
            type: string
            enum: [trace.on, trace-OFF]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              enum: [request-quick, requestAuthZ]
      responses:
        '200':
          description: Exact enum response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
  /enum-no-id:
    post:
      tags: [enums]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              enum: [foo-bar, foo_bar]
      responses:
        '204':
          description: Accepted
  /numeric-enum-body:
    post:
      tags: [enums]
      operationId: numericEnumBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
              enum: [1, 2]
      responses:
        '204':
          description: Accepted
components:
  schemas:
    Mode:
      type: string
      nullable: true
      enum: [fast-mode, authZ, legacy.value]
    CollidingMode:
      type: string
      enum: [foo-bar, foo_bar, FOO-BAR]
    EnumEnvelope:
      type: object
      properties:
        inlineMode:
          type: string
          nullable: true
          enum: [on-hold, authZ]
        mode:
          $ref: '#/components/schemas/Mode'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/Mode'
        inlineModes:
          type: array
          items:
            type: string
            enum: [batch-fast, batchAuthZ]
