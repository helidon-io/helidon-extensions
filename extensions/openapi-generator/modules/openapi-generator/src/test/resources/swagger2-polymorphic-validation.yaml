---
swagger: '2.0'
info:
  title: Swagger 2 polymorphic validation
  version: 1.0.0
consumes: [application/json]
produces: [application/json]
paths:
  /validate:
    post:
      operationId: validate
      tags: [validation]
      parameters:
        - in: body
          name: constrainedBase
          required: true
          schema:
            $ref: '#/definitions/ConstrainedBase'
      responses:
        '204':
          description: Valid
  /holder:
    post:
      operationId: validateHolder
      tags: [validation]
      parameters:
        - in: body
          name: constrainedHolder
          required: true
          schema:
            $ref: '#/definitions/ConstrainedHolder'
      responses:
        '204':
          description: Valid
definitions:
  ConstrainedBase:
    type: object
    discriminator: kind
    required: [kind]
    properties:
      kind:
        type: string
  ConstrainedChild:
    allOf:
      - $ref: '#/definitions/ConstrainedBase'
      - type: object
        required: [code]
        properties:
          code:
            type: string
            minLength: 2
            maxLength: 10
  ConstrainedHolder:
    type: object
    required: [value]
    properties:
      value:
        $ref: '#/definitions/ConstrainedBase'
