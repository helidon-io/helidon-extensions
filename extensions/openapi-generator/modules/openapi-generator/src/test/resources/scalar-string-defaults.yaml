openapi: 3.1.0
info:
  title: Scalar String Default Test
  version: 1.0.0
paths: {}
components:
  schemas:
    StringDefaults:
      type: object
      properties:
        plain:
          type: string
          default: plain
        empty:
          type: string
          default: ''
        quoted:
          type: string
          default: 'say "hello"'
        backslash:
          type: string
          default: 'C:\temp\file'
        multiline:
          type: string
          default: "line1\nline2\tend"
        unicode:
          type: string
          default: 'café 日本語'
        absent:
          type: string
