---
openapi: 3.0.3
info:
  title: Authoritative discriminators
  version: 1.0.0
paths: {}
components:
  schemas:
    DeclaredBase:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          weird.alias: '#/components/schemas/DeclaredCat'
          MixedCase-2: '#/components/schemas/DeclaredDog'
      required: [kind]
      properties:
        kind:
          type: string
        common:
          type: string
    DeclaredCat:
      allOf:
        - $ref: '#/components/schemas/DeclaredBase'
        - type: object
          properties:
            kind:
              type: string
            whiskers:
              type: integer
              format: int32
    DeclaredDog:
      allOf:
        - $ref: '#/components/schemas/DeclaredBase'
        - type: object
          properties:
            bark:
              type: boolean
    DeclaredBird:
      allOf:
        - $ref: '#/components/schemas/DeclaredBase'
        - type: object
          properties:
            wingspan:
              type: integer
              format: int32
    MetadataAlpha:
      type: object
      properties:
        alpha:
          type: string
    MetadataBeta:
      type: object
      properties:
        beta:
          type: string
    MetadataChoice:
      oneOf:
        - $ref: '#/components/schemas/MetadataAlpha'
        - $ref: '#/components/schemas/MetadataBeta'
      discriminator:
        propertyName: category
        mapping:
          alpha.v1: '#/components/schemas/MetadataAlpha'
    ForcedMetadataCat:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
    ForcedMetadataDog:
      type: object
      properties:
        type:
          type: string
        count:
          type: integer
          format: int32
    ForcedMetadata:
      x-helidon-discriminator-representation: metadata
      oneOf:
        - $ref: '#/components/schemas/ForcedMetadataCat'
        - $ref: '#/components/schemas/ForcedMetadataDog'
      discriminator:
        propertyName: type
    ForcedReadOnlyAlpha:
      type: object
      properties:
        value:
          type: string
    ForcedReadOnlyBeta:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ForcedReadOnly:
      x-helidon-discriminator-representation: readOnlyProperty
      oneOf:
        - $ref: '#/components/schemas/ForcedReadOnlyAlpha'
        - $ref: '#/components/schemas/ForcedReadOnlyBeta'
      discriminator:
        propertyName: type
