openapi: 3.0.3
info:
  title: Adversarial discriminator cases
  version: 1.0.0
paths: {}
components:
  schemas:
    ExtensionBase:
      type: object
      properties:
        kind:
          type: string
          enum: [WIRE_CAT]
      discriminator:
        propertyName: kind
    ExtensionCat:
      allOf:
        - $ref: '#/components/schemas/ExtensionBase'
        - type: object
          x-discriminator-value: WIRE_CAT

    DistinctBase:
      type: object
      properties:
        baseKind:
          type: string
          enum: [mid]
      discriminator:
        propertyName: baseKind
        mapping:
          mid: '#/components/schemas/DistinctMid'
    DistinctMid:
      allOf:
        - $ref: '#/components/schemas/DistinctBase'
        - type: object
          properties:
            leafKind:
              type: string
              enum: [leaf]
          discriminator:
            propertyName: leafKind
            mapping:
              leaf: '#/components/schemas/DistinctLeaf'
    DistinctLeaf:
      allOf:
        - $ref: '#/components/schemas/DistinctMid'
        - type: object

    KindHolder:
      type: object
      properties:
        kind:
          type: string
          enum: [cat, dog]
    UnionCat:
      allOf:
        - $ref: '#/components/schemas/KindHolder'
        - type: object
    UnionDog:
      allOf:
        - $ref: '#/components/schemas/KindHolder'
        - type: object
    EnumPet:
      oneOf:
        - $ref: '#/components/schemas/UnionCat'
        - $ref: '#/components/schemas/UnionDog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/UnionCat'
          dog: '#/components/schemas/UnionDog'

    TransitiveBase:
      type: object
      properties:
        kind:
          type: string
      discriminator:
        propertyName: kind
        mapping:
          leaf: '#/components/schemas/TransitiveLeaf'
    TransitiveMid:
      allOf:
        - $ref: '#/components/schemas/TransitiveBase'
        - type: object
          discriminator:
            propertyName: kind
            mapping:
              leaf: '#/components/schemas/TransitiveLeaf'
    TransitiveLeaf:
      allOf:
        - $ref: '#/components/schemas/TransitiveMid'
        - type: object
