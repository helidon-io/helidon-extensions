---
openapi: 3.0.3
info:
  title: Constrained allOf property validation
  version: 1.0.0
paths: {}
components:
  schemas:
    ConstrainedHolder:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/ConstrainedBase'
    ConstrainedBase:
      type: object
      required: [kind]
      discriminator:
        propertyName: kind
        mapping:
          child: '#/components/schemas/ConstrainedChild'
      properties:
        kind:
          type: string
    ConstrainedChild:
      allOf:
        - $ref: '#/components/schemas/ConstrainedBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              maxLength: 10
