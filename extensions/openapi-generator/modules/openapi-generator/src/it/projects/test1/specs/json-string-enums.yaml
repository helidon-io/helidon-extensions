openapi: 3.0.3
info:
  title: JSON String Enum Test
  version: 1.0.0
paths:
  /enum/{routeMode}:
    post:
      tags: [enums]
      operationId: inspectMode
      parameters:
        - name: routeMode
          in: path
          required: true
          schema:
            type: string
            enum: [fast-mode, authZ]
        - name: mode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Mode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              enum: [request-quick, requestAuthZ]
      responses:
        '200':
          description: Exact enum response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
  /enum-no-id:
    post:
      tags: [enums]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              enum: [foo-bar, foo_bar]
      responses:
        '204':
          description: Accepted
  /numeric-enum-body:
    post:
      tags: [enums]
      operationId: numericEnumBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
              enum: [1, 2]
      responses:
        '204':
          description: Accepted
  /boolean-enum-body:
    post:
      tags: [enums]
      operationId: booleanEnumBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: boolean
              enum: [true, false]
      responses:
        '204':
          description: Accepted
  /validated-enum:
    get:
      tags: [enums]
      operationId: validatedEnum
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [safe]
            minLength: 4
            pattern: ^safe$
      responses:
        '204':
          description: Accepted
  /text-enum-body:
    post:
      tags: [enums]
      operationId: textEnumBody
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              enum: [one]
      responses:
        '204':
          description: Accepted
  /mixed-enum-body:
    post:
      tags: [enums]
      operationId: mixedEnumBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              enum: [one]
          text/plain:
            schema:
              type: string
              enum: [one]
      responses:
        '204':
          description: Accepted
  /helper-name-a:
    get:
      tags: [foo]
      operationId: bar
      parameters:
        - name: apiBazMode
          in: query
          required: true
          schema:
            type: string
            enum: [a]
      responses:
        '204':
          description: Accepted
  /helper-name-b:
    get:
      tags: [foo-api-bar]
      operationId: baz
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [b]
      responses:
        '204':
          description: Accepted
components:
  schemas:
    Mode:
      type: string
      nullable: true
      enum: [fast-mode, authZ, legacy.value]
    CollidingMode:
      type: string
      enum: [foo-bar, foo_bar, FOO-BAR]
    ModeJsonConverter:
      type: string
      enum: [slow]
    EnumEnvelopeInlineModeEnumJsonConverter:
      type: string
      enum: [reserved]
    EnumEnvelope:
      type: object
      properties:
        inlineMode:
          type: string
          nullable: true
          enum: [on-hold, authZ]
        mode:
          $ref: '#/components/schemas/Mode'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/Mode'
        inlineModes:
          type: array
          items:
            type: string
            enum: [batch-fast, batchAuthZ]
        validatedInline:
          type: string
          enum: [safe]
          minLength: 4
          pattern: ^safe$
