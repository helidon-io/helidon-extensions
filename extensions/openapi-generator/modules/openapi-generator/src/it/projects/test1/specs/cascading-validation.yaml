---
openapi: 3.0.3
info:
  title: Cascading Validation API
  version: "1.0"
paths:
  /validate:
    post:
      operationId: validateGraph
      tags: [validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRoot'
      responses:
        "204":
          description: Valid
components:
  schemas:
    ConstrainedLeaf:
      type: object
      properties:
        code:
          type: string
          minLength: 3
        label:
          type: string
          minLength: 2
    ValidationIntermediate:
      type: object
      properties:
        leaf:
          $ref: '#/components/schemas/ConstrainedLeaf'
    ValidationRoot:
      type: object
      properties:
        intermediate:
          $ref: '#/components/schemas/ValidationIntermediate'
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/ConstrainedLeaf'
        uniqueLeaves:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConstrainedLeaf'
        leavesByName:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConstrainedLeaf'
        nestedLeaves:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/ConstrainedLeaf'
