openapi: 3.0.3
servers:
  - url: api/v1/
info: {title: Base path routes, version: "1"}
paths:
  /widgets:
    get:
      tags: [Widgets]
      operationId: listWidgets
      responses:
        "204": {description: OK}
  /widgets/{widgetId}:
    get:
      tags: [Widgets]
      operationId: getWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: OK}
  /health:
    get:
      tags: [Status]
      operationId: health
      responses:
        "204": {description: OK}
  /ready:
    get:
      tags: [Status]
      operationId: ready
      responses:
        "204": {description: OK}
  /:
    get:
      tags: [Root]
      operationId: root
      responses:
        "204": {description: OK}
