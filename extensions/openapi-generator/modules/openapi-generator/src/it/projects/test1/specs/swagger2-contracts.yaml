swagger: '2.0'
info:
  title: Swagger 2 generated contract coverage
  version: '1.0'
basePath: /
consumes:
  - application/json
produces:
  - application/json
paths:
  /mode/{mode}:
    post:
      tags: [modes]
      operationId: inspectMode
      parameters:
        - name: mode
          in: path
          required: true
          type: string
          enum: [fast-mode, authZ]
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Envelope'
      responses:
        '200':
          description: exact mode
          schema:
            $ref: '#/definitions/Mode'
definitions:
  Mode:
    type: string
    enum: [fast-mode, authZ, legacy.value]
  Envelope:
    type: object
    properties:
      mode:
        $ref: '#/definitions/Mode'
      inlineMode:
        type: string
        enum: [on-hold, mixedCase]
      modes:
        type: array
        items:
          $ref: '#/definitions/Mode'
  ApplicableScope:
    type: object
    required:
      - scopeType
    properties:
      scopeType:
        type: string
        enum: [PROJECT_SCOPE, SERVICE_PHONEBOOK_SCOPE]
    discriminator: scopeType
  ProjectScope:
    allOf:
      - $ref: '#/definitions/ApplicableScope'
      - discriminator: PROJECT_SCOPE
        type: object
        properties:
          projectId:
            type: string
  ServicePhoneBookScope:
    allOf:
      - $ref: '#/definitions/ApplicableScope'
      - discriminator: SERVICE_PHONEBOOK_SCOPE
        type: object
        properties:
          serviceName:
            type: string
